services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pipeline_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - pipeline_net

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - pipeline_net

  spark-master:
    image: bitnami/spark:3.5.0-debian-11-r0
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8082:8080"
      - "4040:4040" #for Spark UI access
    volumes:
      - ./spark:/opt/spark-app
      - ./spark/weather_parquet:/opt/weather_parquet
      - ./spark-dist/spark-3.5.0-bin-hadoop3:/opt/spark   #Mount Spark binaries here
    depends_on:
      - kafka
      - mysql
    networks:
      - pipeline_net  

  spark-worker:
    image: bitnami/spark:3.5.0-debian-11-r0
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
      - mysql
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark-app
      - ./spark/weather_parquet:/opt/weather_parquet
      - ./spark-dist/spark-3.5.0-bin-hadoop3:/opt/spark   #Mount Spark binaries here
    networks:
      - pipeline_net  

#airflow-webserver service
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-webserver
    restart: always
    depends_on:
      - postgres
      - kafka
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__FERNET_KEY: CsyI5KwtNkWeXOBKtI4gT5xRuP-iCZwCBXFiCBpKFFU=
      AIRFLOW__WEBSERVER__SECRET_KEY: cwyRPvbK9zO9S1wcGUXjKyUGUpD6VYpB_nkpWbwgrbk
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./kafka_producer:/opt/airflow/kafka_producer
      - ./spark:/opt/spark-app                    #MyETL code
      - ./spark/weather_parquet:/opt/weather_parquet
      - ./spark-dist/spark-3.5.0-bin-hadoop3:/opt/spark   #Corrected Spark binaries
      - ./kafka_producer/.env:/opt/airflow/kafka_producer/.env
    ports:
      - "8080:8080"
    command: >
      bash -c "
        echo 'Waiting for PostgreSQL...';
        while ! pg_isready -h postgres -p 5432; do sleep 1; done;
        echo 'PostgreSQL is ready!';
        airflow db migrate &&
        airflow connections create-default-connections &&
        airflow users create --username airflow --password airflow123 --firstname Tauhid --lastname Alam --role Admin --email tauhid@airflow.local &&
        exec airflow webserver
      "
    networks:
      - pipeline_net

#airflow-scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    restart: on-failure
    depends_on:
      - postgres
      - kafka
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__FERNET_KEY: CsyI5KwtNkWeXOBKtI4gT5xRuP-iCZwCBXFiCBpKFFU=
      AIRFLOW__WEBSERVER__SECRET_KEY: cwyRPvbK9zO9S1wcGUXjKyUGUpD6VYpB_nkpWbwgrbk
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./kafka_producer:/opt/airflow/kafka_producer
      - ./spark:/opt/spark-app                    #MyETL code
      - ./spark/weather_parquet:/opt/weather_parquet
      - ./spark-dist/spark-3.5.0-bin-hadoop3:/opt/spark   #Corrected Spark binaries
    command: >
      bash -c "
        echo 'Waiting 10s to let webserver initialize DB...';
        sleep 10;
        exec airflow scheduler
      "
    networks:
      - pipeline_net  

#Docker based mysql services 
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: weather_pipeline
    ports:
      - "3307:3306"  # Expose to host on port 3307
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - pipeline_net

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - pipeline_net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring_grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - pipeline_net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped
    networks:
      - pipeline_net

volumes:
  postgres-db-volume:
  mysql_data:
  grafana-storage:

networks:
  pipeline_net:
    driver: bridge

